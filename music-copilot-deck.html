<body>
    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Music Copilot Deck</title>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Source+Sans+3:wght@400;600;700&display=swap"
            rel="stylesheet">
        <style>
            :root {
                --manuscript: #f6f1e4;
                --ink: #1b1b22;
                --card: #fffdf6;
                --indigo: #3b3f9c;
                --green: #2e8b57;
                --warn: #b86e00;
                --block: #b23a48;
                --mute: #5f5f6b;
                --pale: #ecebf7;
                --staff: #5a5a66
            }

            * {
                box-sizing: border-box
            }

            html,
            body {
                margin: 0;
                height: 100%;
                background: var(--manuscript);
                color: var(--ink);
                font: 400 18px/1.55 "Source Sans 3", system-ui, sans-serif;
                overflow: hidden
            }

            #deck {
                display: flex;
                height: 100vh;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                scrollbar-width: none
            }

            #deck::-webkit-scrollbar {
                display: none
            }

            .slide {
                flex: 0 0 100vw;
                height: 100vh;
                scroll-snap-align: start;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 56px 72px;
                box-sizing: border-box
            }

            .bar {
                width: min(1100px, 100%);
                background: var(--card);
                border: 3px solid var(--ink);
                border-radius: 24px;
                padding: 44px 52px;
                box-shadow: 0 3px 0 var(--ink);
                position: relative;
                display: grid;
                gap: 18px;
                max-height: calc(100vh - 112px);
                overflow: auto
            }

            .bar>* {
                position: relative
            }

            .bar.hero {
                background: var(--indigo);
                color: #fff;
                border-color: var(--ink)
            }

            .bar.hero h1 {
                color: #fff
            }

            .sign {
                justify-self: start;
                background: var(--ink);
                color: var(--manuscript);
                font: 700 14px/1 "Rubik", sans-serif;
                letter-spacing: .06em;
                text-transform: uppercase;
                border-radius: 999px;
                padding: 8px 14px
            }

            .num {
                font: 700 14px/1 "Rubik", sans-serif;
                color: var(--mute);
                letter-spacing: .06em
            }

            h1,
            h2,
            h3 {
                text-wrap: balance
            }

            h1 {
                font: 700 clamp(60px, 9vw, 116px)/0.95 "Rubik", sans-serif;
                margin: 0
            }

            h2 {
                font: 700 clamp(40px, 5vw, 66px)/1.02 "Rubik", sans-serif;
                margin: 0;
                color: var(--indigo)
            }

            h3 {
                font: 700 13px/1.3 "Rubik", sans-serif;
                margin: 6px 0 0;
                color: var(--green);
                text-transform: uppercase;
                letter-spacing: .08em
            }

            p {
                margin: 0;
                max-width: 62ch
            }

            .lede {
                font-size: 24px;
                font-weight: 600;
                max-width: 50ch
            }

            ul.rules {
                list-style: none;
                margin: 0;
                padding: 0;
                display: grid;
                gap: 10px
            }

            ul.rules li {
                position: relative;
                background: var(--manuscript);
                border-radius: 14px;
                padding: 12px 16px 12px 22px;
                overflow: clip
            }

            ul.rules li::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 6px;
                height: 100%;
                background-color: var(--indigo)
            }

            ul.rules li.bad::before {
                background-color: var(--block)
            }

            ul.rules li.warn::before {
                background-color: var(--warn)
            }

            ul.rules li.info::before {
                background-color: var(--green)
            }

            .cols {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 18px
            }

            .card {
                background: var(--pale);
                border-radius: 18px;
                padding: 18px 20px
            }

            .card b {
                display: block;
                font: 700 26px/1.1 "Rubik", sans-serif;
                color: var(--indigo);
                margin-bottom: 6px
            }

            .card span {
                font-weight: 600
            }

            .steps {
                counter-reset: s;
                list-style: none;
                margin: 0;
                padding: 0;
                display: grid;
                gap: 10px
            }

            .steps li {
                counter-increment: s;
                position: relative;
                padding: 12px 16px 12px 58px;
                background: var(--manuscript);
                border: 2px solid var(--staff);
                border-radius: 16px
            }

            .steps li::before {
                content: counter(s);
                position: absolute;
                left: 14px;
                top: 50%;
                transform: translateY(-50%);
                width: 32px;
                height: 32px;
                border-radius: 50%;
                background: var(--green);
                color: #fff;
                font: 700 15px/32px "Rubik", sans-serif;
                text-align: center
            }

            .staff {
                background: var(--manuscript);
                border: 3px solid var(--ink);
                border-radius: 18px;
                padding: 16px 20px;
                font: 600 18px/1.5 "Source Sans 3", sans-serif
            }

            table {
                width: 100%;
                border-collapse: separate;
                border-spacing: 0 8px;
                font-size: 17px
            }

            th {
                text-align: left;
                font: 700 13px/1 "Rubik", sans-serif;
                color: var(--indigo);
                padding: 4px 14px;
                text-transform: uppercase;
                letter-spacing: .06em
            }

            td {
                background: var(--manuscript);
                padding: 12px 14px;
                vertical-align: top
            }

            td:first-child {
                border-radius: 14px 0 0 14px
            }

            td:last-child {
                border-radius: 0 14px 14px 0
            }

            .ph {
                background: #fff1b8;
                border: 2px dashed var(--warn);
                border-radius: 10px;
                padding: 1px 8px;
                font-weight: 700
            }

            .linkbtn {
                display: inline-block;
                font: 700 18px/1 "Rubik", sans-serif;
                background: var(--indigo);
                color: #fff;
                border: 2px solid var(--ink);
                border-radius: 999px;
                padding: 14px 22px;
                text-decoration: none
            }

            .linkbtn.alt {
                background: var(--card);
                color: var(--ink)
            }

            .linkrow {
                display: flex;
                gap: 14px;
                flex-wrap: wrap
            }

            .meta {
                font-size: 14px;
                color: var(--mute);
                font-weight: 700
            }

            #fab {
                position: fixed;
                right: 22px;
                bottom: 22px;
                z-index: 20;
                width: 58px;
                height: 58px;
                border-radius: 50%;
                border: 3px solid var(--ink);
                background: var(--card);
                color: var(--ink);
                font: 700 22px/1 "Rubik", sans-serif;
                cursor: pointer;
                box-shadow: 3px 3px 0 var(--ink)
            }

            #fab:focus-visible,
            .nav button:focus-visible {
                outline: 3px solid var(--green);
                outline-offset: 3px
            }

            #count {
                position: fixed;
                left: 22px;
                bottom: 26px;
                z-index: 20;
                font: 700 15px/1 "Rubik", sans-serif;
                background: var(--card);
                border: 2px solid var(--ink);
                border-radius: 999px;
                padding: 9px 14px
            }

            .menu {
                position: fixed;
                right: 22px;
                bottom: 94px;
                z-index: 20;
                background: var(--card);
                border: 2px solid var(--ink);
                border-radius: 20px;
                padding: 14px;
                display: none;
                gap: 8px;
                width: 270px;
                max-height: 60vh;
                overflow: auto;
                box-shadow: 4px 4px 0 var(--ink)
            }

            .menu.open {
                display: grid
            }

            .menu button {
                font: 600 15px/1.2 "Source Sans 3", sans-serif;
                text-align: left;
                background: var(--manuscript);
                border: 2px solid var(--ink);
                border-radius: 12px;
                padding: 9px 12px;
                color: var(--ink);
                cursor: pointer
            }

            .menu button[aria-current="true"] {
                background: var(--indigo);
                color: #fff
            }

            .nav {
                position: fixed;
                bottom: 22px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 20;
                display: flex;
                gap: 10px
            }

            .nav button {
                font: 700 16px/1 "Rubik", sans-serif;
                background: var(--card);
                border: 2px solid var(--ink);
                border-radius: 999px;
                padding: 11px 18px;
                color: var(--ink);
                cursor: pointer
            }

            .nav button:disabled {
                opacity: .45;
                cursor: default
            }

            @media (max-width:820px) {
                .slide {
                    padding: 44px 18px
                }

                .cols {
                    grid-template-columns: 1fr
                }

                .bar {
                    padding: 30px 24px
                }

                .nav {
                    display: none
                }
            }
        </style>
    </head>

    <body>
        <main id="deck" aria-label="Music Copilot deck"></main>
        <div id="count" aria-live="polite">1 / 1</div>
        <div class="nav"><button id="prev" aria-label="Previous slide">← Back</button><button id="next" aria-label="Next slide">Next →</button></div>
        <button id="fab" aria-label="Open slide list" aria-expanded="false" aria-controls="menu">≡</button>
        <nav id="menu" class="menu" aria-label="Slides"></nav>
        <script>
            const SLIDES = [
                {
                    title: "Title", html: `
    <section class="slide"><div class="bar hero"><span class="sign" style="background:var(--ink)">Music Copilot</span>
      <span class="num" style="color:#e9e7fb">HACKATHON</span>
      <h1>Music Copilot</h1>
      <p class="lede">A songwriting environment that explains music theory while you write, with scale suggestions beside each chord.</p>
    </div></section>` },
                {
                    title: "Problem", html: `
    <section class="slide"><div class="bar"><span class="sign">Problem</span><span class="num">01</span>
      <h2>Theory stays in the textbook</h2>
      <ul class="rules">
        <li class="bad"><strong>Theory stays abstract.</strong> Lessons teach scales and chords apart from the progression being written.</li>
        <li class="bad"><strong>Improvising needs memory.</strong> Choosing notes over a change requires knowing which scale fits.</li>
        <li class="bad"><strong>Feel is hard to name.</strong> A key or scale has a mood that songwriters often cannot describe.</li>
      </ul></div></section>` },
                {
                    title: "Who it is for", html: `
    <section class="slide"><div class="bar"><span class="sign">Who it is for</span><span class="num">02</span>
      <h2>Music hobbyists</h2>
      <p>An educational environment for individual music hobbyists who write their own material.</p></div></section>` },
                {
                    title: "The idea", html: `
    <section class="slide"><div class="bar"><span class="sign">The idea</span><span class="num">03</span>
      <h2>The theory appears beside the notes</h2>
      <div class="cols">
        <div class="card"><b>Chords in</b><span>Set a key, tempo, and bars. Enter a progression.</span></div>
        <div class="card"><b>Scales out</b><span>Scales and arpeggios, each with a reason, plus the guide tones into the next chord.</span></div>
      </div></div></section>` },
                {
                    title: "How it works", html: `
    <section class="slide"><div class="bar"><span class="sign">How it works</span><span class="num">04</span>
      <h2>Build, read, write, accept</h2>
      <ol class="steps">
        <li>Build a chord progression, or pick a sample, and set the key, tempo and bars.</li>
        <li>Copilot offers the matching scales, arpeggios, and guiding notes.</li>
        <li>Write in tabs or sheet music. Notes that fit are highlighted, and notes outside the scale are marked, never removed.</li>
        <li>Accept, edit, or reject any autofill suggestion. Nothing is added without you.</li>
      </ol></div></section>` },
                {
                    title: "Example", html: `
    <section class="slide"><div class="bar"><span class="sign">Example</span><span class="num">05</span>
      <h2>A jazz turnaround in C major</h2>
      <div class="staff">Dm7 → G7 → Cmaj7 → Am7 · four bars</div>
      <ul class="rules">
        <li><strong>Functions.</strong> Dm7 is labeled ii7, the subdominant, and G7 is labeled the dominant.</li>
        <li><strong>Scales.</strong> Dorian is suggested over Dm7 and Mixolydian over G7, each with a short reason.</li>
        <li class="info"><strong>Guide tones.</strong> The seventh of Dm7 (C) moves by step to the third of G7 (B).</li>
        <li class="warn"><strong>Outside notes.</strong> Notes outside the scale are marked with a symbol, and the songwriter can keep them as a chromatic approach.</li>
      </ul></div></section>` },
                {
                    title: "Guardrails", html: `
    <section class="slide"><div class="bar"><span class="sign">Guardrails</span><span class="num">06</span>
      <h2>What Copilot will not do</h2>
      <ul class="rules">
        <li class="bad">Add notes or chords to a song without an accepted action.</li>
        <li class="bad">Claim one scale or chord is the only correct choice.</li>
        <li class="warn">Use an artist's melody as a template.</li>
        <li class="warn">Store a user's melody to build a profile.</li>
        <li class="info">Show a reason with every suggestion.</li>
      </ul></div></section>` },
                {
                    title: "Decisions", html: `
    <section class="slide"><div class="bar"><span class="sign">Decisions</span><span class="num">07</span>
      <h2>What v1 covers</h2>
      <ul class="rules">
        <li><strong>Genres:</strong> jazz, instrumental writing, pop and rock, and blues.</li>
        <li><strong>Editor:</strong> guitar tab and sheet music drawn from the same note data, so a note entered in one appears in the other.</li>
        <li><strong>Beginners:</strong> see the chord name, whether it is in the key, borrowed or outside, the ranked scales and arpeggios, and a short reason for each.</li>
        <li><strong>Length:</strong> a progression holds up to sixteen bars. Longer ones are split into sections.</li>
        <li><strong>Library:</strong> the sample progressions hold chord changes only, never a melody or recording.</li>
      </ul></div></section>` },
                {
                    title: "Competitive landscape", html: `
    <section class="slide"><div class="bar"><span class="sign">Landscape</span><span class="num">08</span>
      <h2>The gap is the reason, not the theory</h2>
      <p>Notation software handles tabs and sheet music but does not explain theory. Online courses teach scales and chords in isolation. Chord finders suggest chords, and some, such as Scaler 3, show the scales that fit, but they rarely show guide tones between chords.</p>
      <p>The closest competitor, Hookpad, already puts theory inside the writing. Music Copilot differs with a written reason for every suggestion, guide tones into the next chord, and out-of-key chords labeled rather than hidden.</p>
      <p class="meta">Reviewed November 2026: Hookpad, Scaler 3, Captain Chords, Guitar Pro 8, MuseScore Studio, musictheory.net. All six play audio, which Music Copilot does not in v1.</p></div></section>` },
                {
                    title: "Technical challenges", html: `
    <section class="slide"><div class="bar"><span class="sign">Challenges</span><span class="num">09</span>
      <h2>Two parts carry the risk</h2>
      <ul class="rules">
        <li><strong>Borrowed chords.</strong> A chord outside the key is labeled, not corrected. A test script checks the engine on the sample progressions, including a borrowed iv and a secondary dominant.</li>
        <li><strong>Autofill rules.</strong> Phrases come from rules, not recordings. Autofill has no test script yet.</li>
        <li class="warn"><strong>Two rule sets.</strong> The editor and autofill use a simpler rule set that labels a chord only as inside the key or "borrowed or outside", and does not recognize secondary dominants.</li>
        <li class="info"><strong>Explanations.</strong> The model writes text only from the engine's output.</li>
      </ul></div></section>` },
                {
                    title: "Tech stack", html: `
    <section class="slide"><div class="bar"><span class="sign">Tech stack</span><span class="num">10</span>
      <h2>A rule-based engine, with a text layer</h2>
      <div class="staff">INPUT → THEORY ENGINE → SUGGESTIONS → EDITOR → AUTOFILL → EXPLAIN → STORE</div>
      <ul class="rules">
        <li><strong>App:</strong> Astro 5 with server rendering, deployed on Vercel.</li>
        <li><strong>Data:</strong> Amazon DynamoDB for accounts and saved songs. Songs on the songs page stay on the device unless synced.</li>
        <li><strong>Explanations:</strong> Claude on Amazon Bedrock, given the theory engine's results as input.</li>
        <li><strong>Accounts:</strong> Better Auth.</li>
      </ul></div></section>` },
                {
                    title: "Data and accessibility", html: `
    <section class="slide"><div class="bar"><span class="sign">Data and access</span><span class="num">11</span>
      <h2>The songwriter's work stays theirs</h2>
      <div class="cols">
        <div class="card"><b>Data</b><span>Songs stay on the device unless the songwriter syncs them. Saved songs with an account are stored on the server. Melodies and progressions are not used to train models or shared without an explicit export. Deleting an account removes synced copies right away.</span></div>
        <div class="card"><b>Accessibility</b><span>Scale and chord diagrams have text descriptions, such as "C major scale: C, D, E, F, G, A, B." Notes outside the scale carry a symbol, so color is never the only signal. Full keyboard and screen reader support is still in progress.</span></div>
      </div></div></section>` },
                {
                    title: "Hackathon scope", html: `
    <section class="slide"><div class="bar"><span class="sign">Scope</span><span class="num">12</span>
      <h2>What the build covers</h2>
      <table><thead><tr><th>Piece</th><th>Status</th></tr></thead><tbody>
        <tr><td>Progression builder for chords, key, tempo, and bars</td><td>built</td></tr>
        <tr><td>Scale and arpeggio suggestions with reasons</td><td>built</td></tr>
        <tr><td>Tab and sheet music editor, and autofill</td><td>built</td></tr>
        <tr><td>Sample progression selection (four samples)</td><td>built</td></tr>
        <tr><td>Scale diagram for each chord, with a text description</td><td>built</td></tr>
        <tr><td>Songs page and usage metrics page</td><td>built</td></tr>
        <tr><td>Audio playback</td><td>out of scope for v1</td></tr>
        <tr><td>Full song generation</td><td>non-goal</td></tr>
      </tbody></table></div></section>` },
                {
                    title: "Metrics", html: `
    <section class="slide"><div class="bar"><span class="sign">Metrics</span><span class="num">13</span>
      <h2>What the app measures</h2>
      <table><thead><tr><th>Metric</th><th>How it is measured</th></tr></thead><tbody>
        <tr><td>Progressions built</td><td>Sessions that save a progression, out of all sessions</td></tr>
        <tr><td>Suggestions accepted</td><td>Suggestions accepted, out of suggestions shown</td></tr>
        <tr><td>Theory checks</td><td>Devices that open a suggestion's reason</td></tr>
        <tr><td>Time to first scale</td><td>Median seconds from the first chord to the first scale view</td></tr>
      </tbody></table>
      <p class="meta">Metrics count events only and never store chords, notes or melodies. Targets are not set yet.</p></div></section>` },
                {
                    title: "Team", html: `
    <section class="slide"><div class="bar"><span class="sign">Team</span><span class="num">14</span>
      <h2>Who built it</h2>
      <table><thead><tr><th>Contributor</th><th>Role</th></tr></thead><tbody>
        <tr><td>Adarsh Kumar</td><td>App shell, accounts, DynamoDB, Bedrock, design system, spec</td></tr>
        <tr><td>Alexis Munoz Buenrostro</td><td>Tab and sheet music editor, scales page, suggestions panel, autofill</td></tr>
        <tr><td>Edgar Camacho-Esteves</td><td>Theory engine, progression builder, accessibility, decisions</td></tr>
        <tr><td>Jeremy Zhu</td><td>Songs and storage, metrics</td></tr>
        <tr><td>Alex Carranza Loza</td><td>Decisions on open questions</td></tr>
      </tbody></table></div></section>` },
                {
                    title: "Links", html: `
    <section class="slide"><div class="bar hero"><span class="sign" style="background:var(--ink)">Links</span><span class="num" style="color:#e9e7fb">15</span>
      <h1>Thank you</h1>
      <p class="lede">Try the app or read the idea paper.</p>
      <div class="linkrow"><a class="linkbtn alt" href="https://tonepilot.adarshrkumar.app">Open the app</a><a class="linkbtn alt" href="https://claude.ai/artifact/BP4hj1nc6WRVfGHXgMzcRb">Idea paper</a></div>
    </div></section>` }
            ];

            const deck = document.getElementById("deck");
            const count = document.getElementById("count");
            const prevBtn = document.getElementById("prev");
            const nextBtn = document.getElementById("next");
            const fab = document.getElementById("fab");
            const menu = document.getElementById("menu");
            let locked = false;
            let current = 0;

            SLIDES.forEach(function (s, i) {
                const wrap = document.createElement("div");
                wrap.innerHTML = s.html.trim();
                const el = wrap.firstElementChild;
                el.dataset.index = i;
                el.id = "slide-" + (i + 1);
                deck.appendChild(el);
                const b = document.createElement("button");
                b.textContent = (i + 1) + ". " + s.title;
                b.addEventListener("click", function () { go(i); openMenu(false); });
                menu.appendChild(b);
            });
            const menuButtons = menu.querySelectorAll("button");
            const slides = deck.querySelectorAll(".slide");
            count.textContent = "1 / " + slides.length;

            function go(i) {
                i = Math.max(0, Math.min(slides.length - 1, i));
                slides[i].scrollIntoView({ behavior: "smooth", inline: "start", block: "nearest" });
                setCurrent(i);
            }
            function setCurrent(i) {
                current = i;
                count.textContent = (i + 1) + " / " + slides.length;
                prevBtn.disabled = i === 0;
                nextBtn.disabled = i === slides.length - 1;
                menuButtons.forEach(function (b, j) { b.setAttribute("aria-current", j === i ? "true" : "false"); });
            }
            function step(d) {
                locked = true;
                go(current + d);
                setTimeout(function () { locked = false; }, 700);
            }
            function openMenu(open) {
                menu.classList.toggle("open", open);
                fab.setAttribute("aria-expanded", open ? "true" : "false");
            }

            prevBtn.addEventListener("click", function () { step(-1); });
            nextBtn.addEventListener("click", function () { step(1); });
            fab.addEventListener("click", function () { openMenu(!menu.classList.contains("open")); });

            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") { openMenu(false); return; }
                if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) {
                    if (e.key === " " && (e.target.tagName === "BUTTON" || e.target.tagName === "A")) return;
                    e.preventDefault(); step(1);
                } else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) {
                    e.preventDefault(); step(-1);
                }
            });

            deck.addEventListener("wheel", function (e) {
                if (Math.abs(e.deltaY) < Math.abs(e.deltaX) && e.deltaX === 0) return;
                e.preventDefault();
                if (locked) return;
                step((e.deltaY || e.deltaX) > 0 ? 1 : -1);
            }, { passive: false });

            const io = new IntersectionObserver(function (entries) {
                entries.forEach(function (en) {
                    if (en.isIntersecting && en.intersectionRatio >= 0.6) {
                        setCurrent(Number(en.target.dataset.index));
                        en.target.querySelectorAll("[data-w]").forEach(function (f) {
                            f.style.width = f.dataset.w + "%";
                        });
                    }
                });
            }, { root: deck, threshold: 0.6 });
            slides.forEach(function (s) { io.observe(s); });
            setCurrent(0);
        </script>
